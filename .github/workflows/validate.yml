name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate manifests and skill inventory
        run: python3 scripts/validate.py
      - name: Smoke-test ChatGPT packaging
        run: |
          ./scripts/package-chatgpt.sh
          test "$(find dist/chatgpt -name '*.zip' | wc -l)" -eq 78
